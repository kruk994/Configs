# Star Wars desktop themes -- the single source of truth.
#
# Every planet's palette lives here once. chezmoi renders it into:
#   - an Omarchy theme (colors.toml, icons.theme)            on Omarchy
#   - a base24 scheme for tinty (terminals, shell, Neovim)    everywhere else
#   - theme.env for star-wars-theme (GNOME, Hyprland, Waybar, Quickshell)
#
# Keys under `colors` are Omarchy's colors.toml names; the base24 slot each one
# fills is in .chezmoitemplates/star-wars/base24.yaml. Wallpapers are the files in
# dot_local/share/star-wars-themes/<planet>/backgrounds/, shown in name order.
#
# gnomeAccent: one of GNOME 47+'s fixed accents (blue teal green yellow orange
#   red pink purple slate) -- GNOME cannot take an arbitrary colour there.
# icons: Yaru variant, used where it is installed (Omarchy, Ubuntu).
# border: Hyprland active border gradient, RRGGBBAA stops + angle in degrees.
starWars:
  planets:
    tatooine:
      name: Tatooine
      gnomeAccent: orange
      icons: Yaru-yellow
      border: { colors: ["f7c27aee", "e07b39ee"], angle: 45 }
