# ── Starship prompt ─────────────────────────────────────────────────────────
# Managed by chezmoi -- edit dot_config/starship.toml in ~/git/configs.
# Legend of every icon: run `prompt-help` (defined in ~/.config/shell/42.sh).
#
# Colours are ANSI names only (blue, cyan, bright-black...), never hex. The
# terminal maps them through its palette, and `omarchy theme set` swaps that
# palette, so the prompt follows every theme with no template or hook. Inside
# Neovim's :terminal the palette comes from the colorscheme (terminal_color_*),
# so it matches there too. The same file works unchanged on macOS and at 42.
#
# Icons need a Nerd Font (Omarchy ships JetBrainsMono Nerd Font).

add_newline = true
command_timeout = 500

format = """
$os$username$hostname$env_var$directory\
$git_branch$git_commit$git_state$git_status$git_metrics\
$fill\
$c$python$nodejs$cmd_duration$jobs$status$time
$character"""

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[os]
disabled = false
format = "[$symbol]($style)"
style = "blue"

[os.symbols]
Arch = " "
Macos = " "
Ubuntu = " "
Linux = " "

# user@host only over SSH (or as root), so the local prompt stays clean.
[username]
format = "[$user]($style)@"
style_user = "yellow"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "yellow"

# Neovim sets $NVIM in its :terminal -- show that the shell lives inside it.
[env_var.NVIM]
format = "[ ]($style)"
style = "green"

# Full path from ~, not cut down to the repo root.
[directory]
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " "
read_only_style = "red"
repo_root_style = "bold cyan"
repo_root_format = "[ $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "magenta"

# Short hash only when HEAD is detached, plus the tag if there is one.
[git_commit]
format = "[ $hash$tag]($style) "
style = "magenta"
tag_disabled = false
tag_symbol = "  "

# REBASING 2/5, MERGING, BISECTING...
[git_state]
format = "[ $state( $progress_current/$progress_total)]($style) "
style = "bold yellow"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "yellow"
conflicted = " ${count} "
ahead = "${count} "
behind = "${count} "
diverged = "${ahead_count}${behind_count} "
untracked = "${count} "
stashed = " ${count} "
modified = " ${count} "
staged = " ${count} "
renamed = " ${count} "
deleted = " ${count} "

# Lines added/removed in the working tree vs HEAD.
[git_metrics]
disabled = false
format = "([$added]($added_style) )([$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

[c]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bright-black"

[python]
format = "[$symbol$pyenv_prefix($version )(\\($virtualenv\\) )]($style)"
symbol = " "
style = "bright-black"

[nodejs]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bright-black"

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "yellow"

[jobs]
format = "[$symbol$number]($style) "
symbol = " "
number_threshold = 1
style = "blue"

# Exit code of the last command when it failed (127, SIGINT...).
[status]
disabled = false
format = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
symbol = " "
style = "red"

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%H:%M"
style = "bright-black"
