{{- /* base24 scheme for tinty. Called with (dict "id" <planet key> "p" <planet>). */ -}}
{{- $c := .p.colors -}}
# Generated by chezmoi from .chezmoidata/star-wars.yaml in ~/git/configs.
system: "base24"
name: "Star Wars {{ .p.name }}"
slug: "star-wars-{{ .id }}"
author: "kruk994"
variant: "dark"
palette:
  base00: "{{ $c.background }}"
  base01: "{{ $c.lighter_background }}"
  base02: "{{ $c.selection }}"
  base03: "{{ $c.muted }}"
  base04: "{{ $c.dark_foreground }}"
  base05: "{{ $c.foreground }}"
  base06: "{{ $c.light_foreground }}"
  base07: "{{ $c.bright_foreground }}"
  base08: "{{ $c.red }}"
  base09: "{{ $c.orange }}"
  base0A: "{{ $c.yellow }}"
  base0B: "{{ $c.green }}"
  base0C: "{{ $c.cyan }}"
  base0D: "{{ $c.blue }}"
  base0E: "{{ $c.magenta }}"
  base0F: "{{ $c.brown }}"
  base10: "{{ $c.dark_background }}"
  base11: "{{ $c.darker_background }}"
  base12: "{{ $c.bright_red }}"
  base13: "{{ $c.bright_yellow }}"
  base14: "{{ $c.bright_green }}"
  base15: "{{ $c.bright_cyan }}"
  base16: "{{ $c.bright_blue }}"
  base17: "{{ $c.bright_magenta }}"
